# This file describes a Fastly Compute package. To learn more visit:
# https://www.fastly.com/documentation/reference/compute/fastly-toml

authors = []
cloned_from = "https://github.com/fastly/compute-starter-kit-javascript-empty"
description = "Simple AEM Edge Functions Boilerplate"
language = "javascript"
manifest_version = 3
name = "aem-edge-functions-boilerplate"
service_id = ""

[scripts]
  post_init = "npm install"
  # Overrides the Fastly CLI's default JavaScript build
  # ("npm exec js-compute-runtime ./src/index.js ./bin/main.wasm") so that the TMDB token
  # is regenerated into src/generated/secrets.js on every build. `aio aem edge-functions`
  # serve/build/deploy all shell out to `fastly compute build`, so this hook covers all
  # three even when they are invoked directly rather than through npm.
  build = "node scripts/gen-secrets.mjs && npm exec js-compute-runtime ./src/index.js ./bin/main.wasm"

[local_server]
  [local_server.backends]
    [local_server.backends.open-meteo]
      url = "https://api.open-meteo.com"
    [local_server.backends.tmdb]
      url = "https://api.themoviedb.org"
    [local_server.backends.pokeapi]
      url = "https://pokeapi.co"
