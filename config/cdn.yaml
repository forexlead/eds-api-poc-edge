kind: 'CDN'
version: '1'
metadata:
  envTypes: ["stage"]
data:
  originSelectors:
    rules:
      # Boilerplate smoke-test route
      - name: route-hello-world-to-edge-function
        when: { reqProperty: path, equals: "/hello-world" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
      # POC: must always reach the function (no CDN cache)
      - name: route-api-uncached
        when: { reqProperty: path, matches: "^/api/(health|resilient)$" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
          skipCache: true
      # POC: CDN-cacheable (Surrogate-Control + Surrogate-Key set by the function)
      - name: route-api-cached
        when: { reqProperty: path, matches: "^/api/(movies|movie|dashboard|lite)$" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
