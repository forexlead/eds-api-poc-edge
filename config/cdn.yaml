kind: 'CDN'
version: '1'
metadata:
  envTypes: ["dev"]
data:
  # CDN purge (scripts/purge.sh). The key comes from the Cloud Manager secret variable
  # CDN_PURGEKEY_290926 on the dev environment — never write its value here. Declare only
  # purgeKey1: a second active key is Adobe's documented cause of "Unauthorized purge".
  authentication:
    authenticators:
      - name: purge-auth
        type: purge
        purgeKey1: ${{CDN_PURGEKEY_290926}}
    rules:
      - name: purge-auth-rule
        when: { reqProperty: tier, equals: "publish" }
        action:
          type: authenticate
          authenticator: purge-auth
  originSelectors:
    rules:
      # Boilerplate smoke-test route
      - name: route-hello-world-to-edge-function
        when: { reqProperty: path, equals: "/hello-world" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
      # POC: must always reach the function (no CDN cache)
      - name: route-api-uncached
        when: { reqProperty: path, matches: "^/api/(health|resilient)$" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
          skipCache: true
      # POC: CDN-cacheable (Surrogate-Control + Surrogate-Key set by the function)
      - name: route-api-cached
        when: { reqProperty: path, matches: "^/api/(movies|movie|dashboard|lite)$" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
      # Cache Lab (docs/cache-lab.md): CDN-cacheable — the CDN must be in the path; each
      # route sets its own Surrogate-Control (mypage sets no-store)
      - name: route-api-cache-lab
        when: { reqProperty: path, matches: "^/api/cache/(product|stock|mypage|quote)$" }
        action:
          type: selectAemOrigin
          originName: edgefunction-api-poc
